<!DOCTYPE html><html><head><meta charset="utf-8"><style>
html,body{margin:0;padding:0;width:264px;height:264px;overflow:hidden;}
.tile{position:relative;width:264px;height:264px;overflow:hidden;
  background:radial-gradient(120% 120% at 50% 12%,#12151F 0%,#07080A 62%);}
.corona{position:absolute;left:50%;top:50%;width:198.8px;height:198.8px;transform:translate(-50%,-50%);border-radius:50%;
  background:radial-gradient(50% 50% at 50% 50%,rgba(124,147,232,0.62) 34%,rgba(124,147,232,0.10) 62%,transparent 76%);}
.ring{position:absolute;left:50%;top:50%;width:125.9px;height:125.9px;transform:translate(-50%,-50%);border-radius:50%;
  background:#7C93E8;box-shadow:0 0 29px 7.3px rgba(124,147,232,0.5);}
.disc{position:absolute;left:50%;top:50%;width:119.6px;height:119.6px;transform:translate(-50%,-50%);border-radius:50%;
  background:#080A0E;}
</style></head><body><div class="tile"><div class="corona"></div><div class="ring"></div><div class="disc"></div></div></body></html>
