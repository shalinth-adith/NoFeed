name: NoFeed

# ─────────────────────────────────────────────────────────────────────────────
# XcodeGen manifest — the single source of truth for NoFeed's project structure.
# After editing this file, run `xcodegen generate` to rebuild NoFeed.xcodeproj.
# Do NOT edit the generated .xcodeproj by hand.
# ─────────────────────────────────────────────────────────────────────────────

options:
  bundleIdPrefix: me.adithyan.shalinth
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
  developmentLanguage: en
  minimumXcodeGenVersion: "2.38.0"

settings:
  base:
    DEVELOPMENT_TEAM: 649T62WKAQ
    SWIFT_VERSION: "5.0"
    # Raise this after EVERY approved release. Once a version is approved its
    # train closes, and App Store Connect refuses any further build under it
    # (errors 90186 "train is closed" + 90062 "must contain a higher version").
    # Xcode's "Manage Version and Build Number" does NOT save you here — it
    # rewrites CFBundleVersion at upload, never CFBundleShortVersionString.
    MARKETING_VERSION: "1.1"
    # Deliberately not bumped per release: the same Distribute option rewrites
    # this to a unique value at upload, so the manifest number is not what App
    # Store Connect shows. It only matters if that option is ever switched off.
    CURRENT_PROJECT_VERSION: "2"
    CODE_SIGN_STYLE: Automatic
    # iPhone only (1). iPad (2) is deliberately not claimed: the Quiet layout is a
    # single non-scrolling iPhone column, the hero orb is sized against iPhone
    # screen heights, and Live Activities / Dynamic Island are iPhone-only. App
    # Review tests iPad when you declare it, so claiming untested support invites
    # a design rejection. Add "2" back once the iPad layout is actually built.
    TARGETED_DEVICE_FAMILY: "1"
    SWIFT_EMIT_LOC_STRINGS: YES

# App Group shared by every target. Defined once here, referenced in each
# target's entitlements below so the identifier can never drift.
fileGroups:
  - project.yml

targets:
  # ───────────────────────────── Main app ─────────────────────────────
  NoFeed:
    type: application
    platform: iOS
    sources:
      - path: NoFeed
      - path: Shared
    dependencies:
      - target: NoFeedMonitor
      - target: NoFeedShield
      - target: NoFeedShieldAction
      - target: NoFeedReport
      - target: NoFeedWidget
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: me.adithyan.shalinth.Zenly
        TARGETED_DEVICE_FAMILY: "1"
        GENERATE_INFOPLIST_FILE: NO
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    info:
      path: NoFeed/Info.plist
      properties:
        # Version pair comes from the build settings above, so project.yml stays
        # the single source of truth. Every extension must carry the SAME pair as
        # the app or App Store Connect rejects the upload outright.
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        # User-facing app name on the Home Screen / Settings. The bundle id and
        # App Group deliberately keep their original "Zenly" spelling: they are
        # the App Store identity (and the key the approved Family Controls
        # entitlement hangs off), so renaming them would register a brand-new
        # app and strand every existing install's data.
        CFBundleDisplayName: "NoFeed"
        UILaunchScreen:
          UIColorName: LaunchBackground
        # NoFeed uses only exempt encryption (HTTPS + Apple standard frameworks),
        # so declare no non-exempt encryption — stops the per-build export
        # compliance prompt in App Store Connect.
        ITSAppUsesNonExemptEncryption: false
        NSSupportsLiveActivities: true
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        UIApplicationSupportsIndirectInputEvents: true
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        CFBundleURLTypes:
          - CFBundleURLSchemes:
              # "nofeed" is the name-matching scheme going forward. "zenly" stays
              # registered because it shipped: anything already pointing at it
              # (a user's Shortcut, an old link) would break if it were dropped.
              - nofeed
              - zenly
        UIBackgroundModes:
          - processing
          - fetch
        BGTaskSchedulerPermittedIdentifiers:
          - me.adithyan.shalinth.Zenly.refresh
    entitlements:
      path: NoFeed/NoFeed.entitlements
      properties:
        com.apple.developer.family-controls: true
        # Lets the schedule-start reminders break through Focus / Do Not Disturb.
        com.apple.developer.usernotifications.time-sensitive: true
        com.apple.security.application-groups:
          - group.me.adithyan.shalinth.Zenly

  # ─────────────── DeviceActivityMonitor extension (schedules) ───────────────
  NoFeedMonitor:
    type: app-extension
    platform: iOS
    sources:
      - path: NoFeedMonitor
      - path: Shared
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: me.adithyan.shalinth.Zenly.ZenlyMonitor
        TARGETED_DEVICE_FAMILY: "1"
        GENERATE_INFOPLIST_FILE: NO
    info:
      path: NoFeedMonitor/Info.plist
      properties:
        # Version pair comes from the build settings above, so project.yml stays
        # the single source of truth. Every extension must carry the SAME pair as
        # the app or App Store Connect rejects the upload outright.
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        CFBundleDisplayName: NoFeedMonitor
        NSExtension:
          NSExtensionPointIdentifier: com.apple.deviceactivity.monitor-extension
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).DeviceActivityMonitorExtension
    entitlements:
      path: NoFeedMonitor/NoFeedMonitor.entitlements
      properties:
        com.apple.developer.family-controls: true
        com.apple.security.application-groups:
          - group.me.adithyan.shalinth.Zenly

  # ─────────────── ShieldConfiguration extension (custom shield UI) ───────────────
  NoFeedShield:
    type: app-extension
    platform: iOS
    sources:
      - path: NoFeedShield
      - path: Shared/AppGroup.swift
      - path: Shared/DistractionLog.swift
      - path: Shared/ShieldMessage.swift
      - path: Shared/ActiveSessionInfo.swift
      - path: Shared/PausedApp.swift
      # Read only to decide whether the block screen draws its second button.
      - path: Shared/UnlockWindow.swift
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: me.adithyan.shalinth.Zenly.ZenlyShield
        TARGETED_DEVICE_FAMILY: "1"
        GENERATE_INFOPLIST_FILE: NO
    info:
      path: NoFeedShield/Info.plist
      properties:
        # Version pair comes from the build settings above, so project.yml stays
        # the single source of truth. Every extension must carry the SAME pair as
        # the app or App Store Connect rejects the upload outright.
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        CFBundleDisplayName: NoFeedShield
        NSExtension:
          NSExtensionPointIdentifier: com.apple.ManagedSettingsUI.shield-configuration-service
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).ShieldConfigurationExtension
    entitlements:
      path: NoFeedShield/NoFeedShield.entitlements
      properties:
        # Required: this extension links ManagedSettings/ManagedSettingsUI.
        # Apple's automated review rejects any target using a Screen Time API
        # without it — the entitlement is needed on the app AND on every one of
        # its Screen Time extensions, each with its own approved request.
        com.apple.developer.family-controls: true
        com.apple.security.application-groups:
          - group.me.adithyan.shalinth.Zenly

  # ─────────────── ShieldAction extension (shield button handling) ───────────────
  NoFeedShieldAction:
    type: app-extension
    platform: iOS
    sources:
      - path: NoFeedShieldAction
      # Counts the attempt, and grants the timed pass when the second button is
      # pressed. Deliberately still NOT the whole reconcile stack: granting a
      # pass only ever *clears* shields, and clearing names nothing, so this
      # needs `ShieldApplier` but not `ShieldReconciler`/`ActivityShieldStore`.
      # Putting the shields back is `NoFeedMonitor`'s job. See `UnlockWindow`.
      - path: Shared/AppGroup.swift
      - path: Shared/DistractionLog.swift
      - path: Shared/UnlockWindow.swift
      - path: Shared/ShieldApplier.swift
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: me.adithyan.shalinth.Zenly.ZenlyShieldAction
        TARGETED_DEVICE_FAMILY: "1"
        GENERATE_INFOPLIST_FILE: NO
    info:
      path: NoFeedShieldAction/Info.plist
      properties:
        # Version pair comes from the build settings above, so project.yml stays
        # the single source of truth. Every extension must carry the SAME pair as
        # the app or App Store Connect rejects the upload outright.
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        CFBundleDisplayName: NoFeedShieldAction
        NSExtension:
          NSExtensionPointIdentifier: com.apple.ManagedSettings.shield-action-service
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).ShieldActionExtension
    entitlements:
      path: NoFeedShieldAction/NoFeedShieldAction.entitlements
      properties:
        # Required: this extension links ManagedSettings/ManagedSettingsUI.
        # See the note on NoFeedShield above.
        com.apple.developer.family-controls: true
        com.apple.security.application-groups:
          - group.me.adithyan.shalinth.Zenly

  # ─────────────── DeviceActivityReport extension (app usage) ───────────────
  NoFeedReport:
    type: extensionkit-extension
    platform: iOS
    sources:
      - path: NoFeedReport
      - path: Shared/ReportContext.swift
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: me.adithyan.shalinth.Zenly.ZenlyReport
        TARGETED_DEVICE_FAMILY: "1"
        GENERATE_INFOPLIST_FILE: NO
    info:
      path: NoFeedReport/Info.plist
      properties:
        # Version pair comes from the build settings above, so project.yml stays
        # the single source of truth. Every extension must carry the SAME pair as
        # the app or App Store Connect rejects the upload outright.
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        CFBundleDisplayName: NoFeedReport
        # DeviceActivityReport is an ExtensionKit extension (must live in
        # Extensions/, not PlugIns/, with EXAppExtensionAttributes).
        EXAppExtensionAttributes:
          EXExtensionPointIdentifier: com.apple.deviceactivityui.report-extension
    entitlements:
      path: NoFeedReport/NoFeedReport.entitlements
      properties:
        com.apple.developer.family-controls: true
        com.apple.security.application-groups:
          - group.me.adithyan.shalinth.Zenly

  # ───────────────────────── WidgetKit widget ─────────────────────────
  NoFeedWidget:
    type: app-extension
    platform: iOS
    sources:
      - path: NoFeedWidget
      - path: Shared/AppGroup.swift
      - path: Shared/StatsSnapshot.swift
      - path: Shared/FocusActivityAttributes.swift
      - path: Shared/Color+Hex.swift
      - path: Shared/StartFocusIntent.swift
      - path: Shared/FocusLaunchRequest.swift
      - path: Shared/SessionControlIntents.swift
      - path: Shared/SessionControlRequest.swift
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: me.adithyan.shalinth.Zenly.ZenlyWidget
        TARGETED_DEVICE_FAMILY: "1"
        GENERATE_INFOPLIST_FILE: NO
    info:
      path: NoFeedWidget/Info.plist
      properties:
        # Version pair comes from the build settings above, so project.yml stays
        # the single source of truth. Every extension must carry the SAME pair as
        # the app or App Store Connect rejects the upload outright.
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        CFBundleDisplayName: "NoFeed"
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    entitlements:
      path: NoFeedWidget/NoFeedWidget.entitlements
      properties:
        com.apple.security.application-groups:
          - group.me.adithyan.shalinth.Zenly

  # ───────────────────────────── Tests ─────────────────────────────
  NoFeedTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: NoFeedTests
    dependencies:
      - target: NoFeed
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: me.adithyan.shalinth.ZenlyTests
        GENERATE_INFOPLIST_FILE: YES

  NoFeedUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: NoFeedUITests
    dependencies:
      - target: NoFeed
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: me.adithyan.shalinth.ZenlyUITests
        GENERATE_INFOPLIST_FILE: YES

schemes:
  NoFeed:
    build:
      targets:
        NoFeed: all
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - NoFeedTests
        - NoFeedUITests
    profile:
      config: Release
    analyze:
      config: Debug
    archive:
      config: Release
